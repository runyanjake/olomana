networks:
  metrics:
    external: true
  traefik:
    external: true

services:
  minecraft_solo:
    image: itzg/minecraft-server:latest
    container_name: minecraft_solo
    restart: unless-stopped
    networks:
      - traefik
      - metrics
    ports:
      - "25567:25565"
    volumes:
      - /pwspool/games/minecraft/minecraft_solo:/data
    environment:
      - TYPE=PURPUR
      - MEMORY=2G
      - VERSION=LATEST
      - EULA=TRUE
      - SERVER_NAME=minecraft_solo
      - MODE=survival
      - DIFFICULTY=hard
      - OPS=RicecakeSMS,pZ_aeriaL
      - ENABLE_WHITELIST=true
      - WHITELIST=RicecakeSMS,pZ_aeriaL
      - ICON=https://i.imgur.com/sqjZGql.png
      - ENABLE_COMMAND_BLOCK=false
      - GENERATE_STRUCTURES=true
      - MOTD="\u00A77Pinnerland Creative Server, powered by \u00A75P\u00A79W\u00A75S\u00A77\!"
      - PVP=false
      - ALLOW_FLIGHT=true
      - PROMETHEUS_ENABLED=true
      - MINECRAFT_PROMETHEUS_EXPORTER_HOST=0.0.0.0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minemap-solo.rule=Host(`minemap-solo.whitney.rip`)"
      - "traefik.http.routers.minemap-solo.tls=true"
      - "traefik.http.routers.minemap-solo.tls.certresolver=lets-encrypt"
      - "traefik.http.services.minemap-solo.loadbalancer.server.port=8100"

  minecraft_creative:
    image: itzg/minecraft-server:latest
    container_name: minecraft_creative
    restart: unless-stopped
    networks:
      - metrics
    ports:
      - "25566:25565"
    volumes:
      - /pwspool/games/minecraft/minecraft_creative:/data
    environment:
      - TYPE=PURPUR
      - MEMORY=2G
      - VERSION=LATEST
      - EULA=TRUE
      - SERVER_NAME=minecraft_creative
      - MODE=creative
      - DIFFICULTY=peaceful
      - OPS=RicecakeSMS,pZ_aeriaL
      - ENABLE_WHITELIST=true
      - WHITELIST=RicecakeSMS,pZ_aeriaL
      - ICON=https://i.imgur.com/sqjZGql.png
      - ENABLE_COMMAND_BLOCK=true
      - GENERATE_STRUCTURES=false
      - MOTD="\u00A77Pinnerland Creative Server, powered by \u00A75P\u00A79W\u00A75S\u00A77\!"
      - PVP=false
      - LEVEL_TYPE=FLAT
      - ALLOW_FLIGHT=true
      - PROMETHEUS_ENABLED=true
      - MINECRAFT_PROMETHEUS_EXPORTER_HOST=0.0.0.0
    labels:
      - "traefik.enable=false"

  minecraft_2023:
    image: itzg/minecraft-server:latest
    container_name: minecraft_2023
    restart: unless-stopped
    networks:
      - traefik
      - metrics
    ports:
      - "25565:25565"
    volumes:
      - /pwspool/games/minecraft/minecraft_2023:/data
    environment:
      - TYPE=PURPUR
      - MEMORY=4G
      - VERSION=LATEST
      - EULA=TRUE
      - SERVER_NAME=minecraft_2023
      - MODE=survival
      - SPAWN_PROTECTION=0
      - DIFFICULTY=hard
      - OPS=RicecakeSMS,pZ_aeriaL
      - ENABLE_WHITELIST=true
      - WHITELIST=RicecakeSMS,pZ_aeriaL
      - ICON=https://i.imgur.com/sqjZGql.png
      - SEED="itsgoochfor2023"
      - MOTD="\u00A77Pinnerland, powered by \u00A75P\u00A79W\u00A75S\u00A77\!"
      - ALLOW_FLIGHT=false
      - PROMETHEUS_ENABLED=true
      - MINECRAFT_PROMETHEUS_EXPORTER_HOST=0.0.0.0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minemap.rule=Host(`minemap.whitney.rip`)"
      - "traefik.http.routers.minemap.tls=true"
      - "traefik.http.routers.minemap.tls.certresolver=lets-encrypt"
      - "traefik.http.services.minemap.loadbalancer.server.port=8100"

  minecraft_skyblock:
    image: itzg/minecraft-server:latest
    container_name: minecraft_skyblock
    restart: unless-stopped
    networks:
      - metrics
    ports:
      - "25564:25565"
    volumes:
      - /pwspool/games/minecraft/minecraft_skyblock:/data
    environment:
      - TYPE=PURPUR
      - MEMORY=4G
      - VERSION=LATEST
      - EULA=TRUE
      - SERVER_NAME=minecraft_skyblock
      - MODE=survival
      - DIFFICULTY=hard
      - OPS=RicecakeSMS,pZ_aeriaL
      - ENABLE_WHITELIST=true
      - WHITELIST=RicecakeSMS,pZ_aeriaL
      - ICON=https://i.imgur.com/sqjZGql.png
      - MOTD="\u00A77Skyblock, powered by \u00A75P\u00A79W\u00A75S\u00A77\!"
      - PROMETHEUS_ENABLED=true
      - MINECRAFT_PROMETHEUS_EXPORTER_HOST=0.0.0.0
    labels:
      - "traefik.enable=false"
