networks:
  traefik:
    external: true

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    networks:
      - traefik
    privileged: true
    user: root
    volumes:
      - /pwspool/software/jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/local/bin/docker:ro
      - /usr/libexec/docker/cli-plugins/docker-compose:/usr/local/lib/docker/cli-plugins/docker-compose:ro
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro

    labels:
      - traefik.http.routers.jenkins.rule=Host(`jenkins.whitney.rip`)
      - traefik.http.routers.jenkins.tls=true
      - traefik.http.routers.jenkins.tls.certresolver=lets-encrypt
      - traefik.http.services.jenkins.loadbalancer.server.port=8080

